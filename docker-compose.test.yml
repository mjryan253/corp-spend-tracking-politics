version: '3.8'

services:
  test-db:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-redis:
    image: redis:6
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_NAME=test_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=test-redis
      - REDIS_PORT=6379
      - DEBUG=True
      - SECRET_KEY=test-secret-key
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py test --settings=corp_spend_tracker.test_settings &&
             python manage.py check --deploy"
    volumes:
      - ./backend:/app
    networks:
      - test-network

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=test
    command: >
      sh -c "npm ci &&
             npm test -- --coverage --watchAll=false &&
             npm run build"
    volumes:
      - ./frontend:/app
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
